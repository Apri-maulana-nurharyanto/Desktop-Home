<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="icon" href="src/icon/chrome-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <!--  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <video autoplay muted loop id="bg-video">
      <source src="src/video/1000350225.mp4" type="video/mp4" />
    </video>
    <div class="content">
      <div class="top">
        <div class="info">
          <h1>Kurokawa Akane</h1>
          <h2>黒川あかね</h2>
        </div>
        <div class="source">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Search Google or type a URL" />
            <button class="btn-search" id="searchBtn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
          <div class="bookmarks">
            <a
              href="https://hok-ace-translate-id.netlify.app/"
              class="tab"
              target="_blank">
              <i class="fa-solid fa-sd-card"></i>
              <p>HoK:Ace</p>
            </a>
          </div>
        </div>
      </div>
      <div class="center"></div>
      <div class="bottom">
        <div class="date-time">
          <div id="date"></div>
          <div id="time"></div>
        </div>
        <div class="apk-list">
          <a href="https://discord.com/" class="apk" target="_blank">
            <i class="fa-brands fa-discord"></i>
          </a>
          <a href="https://web.whatsapp.com/" class="apk" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
          </a>
          <a href="https://www.youtube.com/" class="apk" target="_blank">
            <i class="fa-brands fa-youtube"></i>
          </a>
          <a href="https://www.instagram.com/" class="apk" target="_blank">
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a href="https://www.tiktok.com/id-ID/" class="apk" target="_blank">
            <i class="fa-brands fa-tiktok"></i>
          </a>
        </div>
      </div>
    </div>
  </body>
  <script
    src="https://kit.fontawesome.com/91d929946f.js"
    crossorigin="anonymous"></script>
  <script src="js/date-time.js"></script>
  <script src="js/search-engine.js"></script>
</html>
