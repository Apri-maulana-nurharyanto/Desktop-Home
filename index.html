<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <title>Desktop - Home</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: relative;
        font-family: "Montserrat", sans-serif;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      #jam {
        font-size: 50px;
        font-weight: bold;
      }
      #tanggal {
        font-size: 24px;
        font-weight: bold;
      }
      .set-list {
        position: relative;
        width: 100%;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .set-list:nth-of-type(3) {
        padding: 0 30px;
      }
      .format {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 50%;
      }
      .apk-list {
        width: 50%;
        display: flex;
        justify-content: end;
        align-items: center;
        gap: 10px;
      }
      .apk {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000;
        padding: 5px;
      }
      .apk:hover {
        transition: 0.3s;
        background-color: #000;
        border-radius: 15px;
        color: #fff;
      }
      .apk p {
        font-size: 12px;
        font-weight: bold;
      }
      .apk #icon {
        font-size: 60px;
      }
      .search-box {
        display: flex;
        align-items: center;
        width: 75%;
        max-width: 584px;
        height: 44px;
        background: #fff;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        padding: 0 15px;
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      }

      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        padding: 0 10px;
      }

      .search-box .btn-search {
        background: none;
        border: none;
        cursor: pointer;
        color: #5f6368;
        font-size: 18px;
        padding: 5px;
      }

      .search-box .btn-search:hover {
        color: #1a73e8;
      }
      .search-engine {
        width: 50%;
        height: 100%;
        display: flex;
        justify-content: end;
        align-items: start;
        padding: 30px;
      }
      .blank {
        width: 50%;
        height: 100%;
        padding: 30px;
        display: flex;
        justify-content: start;
        align-items: start;
      }

      /* Mengunci posisi tombol toggle penuh terhadap layar */
      #toggle-btn {
        position: fixed;
        top: 90px;
        left: 30px;
        z-index: 999;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: rgba(0, 0, 0, 0.5);
        font-size: 20px;
        padding: 8px 12px;
        border-radius: 50%;
        cursor: pointer;
        backdrop-filter: blur(5px);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <video width="100%" height="100%" autoplay loop muted>
      <source src="1000350225.mp4" type="video/mp4" />
    </video>

    <!-- Tombol toggle ditaruh terpisah di luar container agar posisinya absolut/terkunci -->
    <button id="toggle-btn"><i class="fa-solid fa-eye-slash"></i></button>

    <div class="set-list">
      <div class="blank">
        <h1 class="title-text">黒川あかね</h1>
      </div>
      <div class="search-engine">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search Google or type a URL" />
          <button class="btn-search" id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="set-list"></div>
    <div class="set-list">
      <div class="format">
        <div id="tanggal"></div>
        <div id="jam"></div>
      </div>
      <div class="apk-list">
        <a class="apk" href="https://www.youtube.com/" target="_blank">
          <div id="icon"><i class="fa-brands fa-youtube"></i></div>
          <p>Youtube</p>
        </a>
        <a href="https://www.instagram.com/" class="apk" target="_blank">
          <div id="icon"><i class="fa-brands fa-square-instagram"></i></div>
          <p>Instagram</p>
        </a>
      </div>
    </div>

    <!-- Script FontAwesome -->
    <script
      src="https://kit.fontawesome.com/91d929946f.js"
      crossorigin="anonymous"></script>

    <!-- Script Jam dan Tanggal -->
    <script>
      function updateWaktu() {
        const sekarang = new Date();

        // Format Jam
        let jam = sekarang.getHours();
        const menit = String(sekarang.getMinutes()).padStart(2, "0");
        const format = jam >= 12 ? "PM" : "AM";

        jam = jam % 12;
        jam = jam ? jam : 12;
        const formattedHours = String(jam).padStart(2, "0");

        document.getElementById("jam").textContent =
          `${formattedHours}:${menit} ${format}`;

        // Format Tanggal
        const hariList = [
          "Minggu",
          "Senin",
          "Selasa",
          "Rabu",
          "Kamis",
          "Jumat",
          "Sabtu",
        ];
        const bulanList = [
          "jan",
          "feb",
          "mar",
          "apr",
          "mei",
          "jun",
          "jul",
          "agust",
          "sept",
          "okt",
          "nov",
          "des",
        ];

        const namaHari = hariList[sekarang.getDay()];
        const tgl = sekarang.getDate();
        const namaBulan = bulanList[sekarang.getMonth()];
        const tahun = sekarang.getFullYear();

        document.getElementById("tanggal").textContent =
          `${namaHari}, ${tgl} ${namaBulan} ${tahun}`;
      }

      setInterval(updateWaktu, 1000);
      updateWaktu();
    </script>

    <!-- Script Pencarian Google -->
    <script>
      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");

      function cariGoogle() {
        const query = searchInput.value.trim();
        if (query !== "") {
          const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
          window.open(url, "_blank");
        }
      }

      searchBtn.addEventListener("click", cariGoogle);
      searchInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          cariGoogle();
        }
      });
    </script>

    <!-- Script Toggle Hide/Show -->
    <script>
      const toggleBtn = document.getElementById("toggle-btn");
      const formatTime = document.querySelector(".format");
      const searchEngine = document.querySelector(".search-engine");
      const apkList = document.querySelector(".apk-list");
      const titleText = document.querySelector(".title-text");

      toggleBtn.addEventListener("click", () => {
        if (formatTime) formatTime.classList.toggle("hidden");
        if (searchEngine) searchEngine.classList.toggle("hidden");
        if (apkList) apkList.classList.toggle("hidden");
        if (titleText) titleText.classList.toggle("hidden");

        const icon = toggleBtn.querySelector("i");
        if (formatTime && formatTime.classList.contains("hidden")) {
          icon.className = "fa-solid fa-eye";
        } else {
          icon.className = "fa-solid fa-eye-slash";
        }
      });
    </script>
  </body>
</html>
